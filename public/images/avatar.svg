<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#27272a" stroke-width="0.75" />
    </pattern>
  </defs>
  <rect width="400" height="400" fill="url(#bg)" />
  <rect width="400" height="400" fill="url(#grid)" opacity="0.4" />
  
  <!-- Outer precision frame -->
  <rect x="20" y="20" width="360" height="360" fill="none" stroke="#3f3f46" stroke-width="1" />
  <circle cx="200" cy="200" r="140" fill="none" stroke="#52525b" stroke-width="1" stroke-dasharray="4 4" />
  
  <!-- Monogram / Initials -->
  <text x="200" y="215" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="76" font-weight="700" fill="#fafafa" text-anchor="middle" letter-spacing="4">DEV</text>
  <text x="200" y="255" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="14" fill="#a1a1aa" text-anchor="middle" letter-spacing="6">PORTFOLIO</text>
  
  <!-- Corner marks -->
  <path d="M 24 34 L 24 24 L 34 24" fill="none" stroke="#fafafa" stroke-width="2" />
  <path d="M 376 34 L 376 24 L 366 24" fill="none" stroke="#fafafa" stroke-width="2" />
  <path d="M 24 366 L 24 376 L 34 376" fill="none" stroke="#fafafa" stroke-width="2" />
  <path d="M 376 366 L 376 376 L 366 376" fill="none" stroke="#fafafa" stroke-width="2" />
</svg>
